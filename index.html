<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
        content="#e86f9d">

    <meta name="description"
        content="Aplikasi catatan sederhana dengan tema pink">

    <title>My Melody Notes 🎀</title>

    <link rel="stylesheet"
        href="style.css">

    <link rel="manifest"
        href="manifest.json">
</head>

<body>

    <!-- DEKORASI -->
    <div class="dekor dekor-1">🎀</div>
    <div class="dekor dekor-2">🌸</div>
    <div class="dekor dekor-3">♡</div>


    <main class="container">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="logo">
                🐰
            </div>

            <div class="header-text">

                <h1>
                    Notes App
                </h1>

                <p>
                    Catat ide dan tugasmu di sini ✨
                </p>

            </div>

        </header>


        <!-- ================= FORM ================= -->

        <section class="form-card">

            <div class="form-header">

                <h2 id="formTitle">
                    ✨ Buat Catatan
                </h2>

                <span class="ribbon">
                    🎀
                </span>

            </div>


            <div class="input-wrapper">

                <input
                    type="text"
                    id="judul"
                    placeholder="Masukkan judul catatan..."
                    autocomplete="off">

            </div>


            <div class="input-wrapper">

                <textarea
                    id="isi"
                    rows="6"
                    placeholder="Tulis isi catatan di sini..."></textarea>

            </div>


            <div class="button-group">

                <button
                    id="btnSimpan"
                    class="btn-simpan"
                    onclick="simpanCatatan()">

                    💾 Simpan Catatan

                </button>


                <button
                    id="btnBatal"
                    class="btn-batal"
                    onclick="batalEdit()">

                    ❌ Batal

                </button>

            </div>

        </section>


        <!-- ================= SEARCH ================= -->

        <section class="search-card">

            <div class="search-icon">
                🔍
            </div>

            <input
                type="text"
                id="search"
                placeholder="Cari catatan..."
                oninput="cariCatatan()">

        </section>


        <!-- ================= DAFTAR ================= -->

        <div class="list-header">

            <h2>
                📚 Daftar Catatan
            </h2>

            <span id="jumlahCatatan">
                0 Catatan
            </span>

        </div>


        <section id="daftarCatatan"
            class="notes-container">

        </section>


    </main>


    <footer>
        Made with 💗 for your notes
    </footer>


    <script src="app.js"></script>

</body>

</html>
